<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolidCore — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0D1117; font-family: 'Inter', system-ui, sans-serif; }
    .card { background: #161B22; border: 1px solid #30363D; }
    .accent { color: #FF6B35; }
    .btn-primary { background: #FF6B35; }
    .btn-primary:hover { background: #e55a24; }
    input { background: #0D1117; border: 1px solid #30363D; color: #E6EDF3; }
    input:focus { border-color: #FF6B35; outline: none; }
    .error-box { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.4); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="card rounded-2xl p-10 w-full max-w-sm">
    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <div class="flex flex-col items-center gap-2">
        <div class="w-14 h-14 rounded-full bg-[#1C2333] border border-[#30363D] flex items-center justify-center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"/>
          </svg>
        </div>
        <h1 class="text-xl font-bold text-white tracking-tight">SolidCore</h1>
        <p class="text-xs text-[#8B949E]">Performance Analytics Platform</p>
      </div>
    </div>

    <h2 class="text-lg font-semibold text-white mb-6 text-center">Sign in to your account</h2>

    <div id="error" class="error-box rounded-lg px-4 py-3 mb-4 text-red-400 text-sm hidden"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-[#8B949E] mb-1.5">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required
          class="w-full rounded-lg px-3.5 py-2.5 text-sm transition" />
      </div>
      <div>
        <label class="block text-xs font-medium text-[#8B949E] mb-1.5">Password</label>
        <input id="password" type="password" placeholder="••••••••" required
          class="w-full rounded-lg px-3.5 py-2.5 text-sm transition" />
      </div>
      <button type="submit" id="submitBtn"
        class="btn-primary w-full rounded-xl py-2.5 text-sm font-semibold text-white transition mt-2">
        Sign In
      </button>
    </form>

    <p class="text-center text-xs text-[#8B949E] mt-6">
      Only registered athletes and admins can sign in.<br/>
      Contact your coach to get access.
    </p>
  </div>

  <script>
    const API = '/api';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('error');
      errEl.classList.add('hidden');
      btn.textContent = 'Signing in…';
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('sc_token', data.token);
        localStorage.setItem('sc_user', JSON.stringify(data.user));

        window.location.href = data.user.role === 'admin' ? '/admin' : '/dashboard';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
