name: fitness_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

  camera: ^0.10.5+5
  google_mlkit_pose_detection: ^0.14.1

  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  config:
    enable-lldb-debugging: false

  uses-material-design: true

  assets:
    - .env
    - assets/images/solidcore_logo.png
    - assets/config.json